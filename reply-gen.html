<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>跟进索要联系方式话术</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif;margin:0;padding:0}
body{background:#f4f7fa;padding:30px;max-width:1000px;margin:0 auto}
h1{font-size:22px;margin-bottom:8px;color:#222}
.desc{color:#666;margin-bottom:20px;font-size:14px}
.box{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 10px #00000010}
#textArea{width:100%;min-height:240px;border:1px solid #ddd;padding:16px;font-size:15px;white-space:pre-line;border-radius:8px;resize:vertical}
.btns{margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
button{padding:10px 18px;border:none;border-radius:8px;cursor:pointer;font-size:15px;color:#fff}
#genBtn{background:#1677ff;}
#copyBtn{background:#36cba7;}
#clearBlackBtn{background:#e74c3c;}
#clearHistoryBtn{background:#9b78ff;}
button:active{opacity:0.85}
.tip{margin-top:12px;color:#666;font-size:14px;line-height:1.5}
.history{margin-top:16px;padding:12px;background:#f8f9fa;border-radius:8px;font-size:13px;color:#444;max-height:180px;overflow:auto}
.blackInfo{margin-top:10px;color:#c0392b;font-size:13px}
.copyTip{margin-top:8px;color:#27ae60;min-height:22px;font-size:14px}
/* 登录弹窗样式 */
.login-wrap{position:fixed;inset:0;background:rgba(0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:999}
.login-card{background:#fff;padding:28px;border-radius:12px;width:360px}
.login-card h2{margin:0 0 16px;font-size:20px}
.login-card input{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:16px;margin-bottom:14px}
.login-card button{width:100%;background:#1677ff;color:#fff;padding:10px;border-radius:8px;border:none;font-size:16px}
.login-err{color:red;margin-bottom:10px;font-size:14px}
.hidden{display:none !important;}
.loading-text{color:#444;margin-bottom:10px}
</style>
</head>
<body>
<!-- 邮箱登录弹窗 -->
<div class="login-wrap" id="loginWrap">
    <div class="login-card">
        <h2>每日授权验证</h2>
        <div class="loading-text" id="loadingText">正在加载授权列表...</div>
        <div class="login-err" id="loginErr"></div>
        <input type="text" id="emailInput" placeholder="请输入今日授权邮箱" disabled>
        <button id="loginBtn" disabled>进入工具</button>
    </div>
</div>
<div class="box" id="toolBox">
<h1>跟进索要联系方式话术</h1>
<div class="desc">隐晦索要联系方式｜随机差异化文案｜复制自动加入黑名单</div>
<textarea id="textArea" readonly>点击【生成差异化话术】</textarea>
<div class="btns">
<button id="genBtn">生成差异化话术</button>
<button id="copyBtn">复制到剪贴板</button>
<button id="clearBlackBtn">清空黑名单</button>
<button id="clearHistoryBtn">清空临时历史</button>
</div>
<div class="copyTip" id="copyTip"></div>
<div class="blackInfo">黑名单数量：<span id="blackCount">0</span>（关闭页面数据不会丢失）</div>
<div class="tip">
风控要点：点击复制自动加入黑名单，避免重复文本；随机句式降低平台限流风险
</div>
<div class="history" id="historyBox">
最近生成记录：
</div>
</div>
<script>
// 共用auth.json，和index.html同一个远程授权文件
const AUTH_JSON_URL = "https://fc-dotcom.github.io/tm-tool/auth.json";
let validEmailList = [];
let currentLoginEmail = "";
let checkTimer = null;

// ============ 索要联系方式词库 ============
const lib = {
    greet: [
        "Hope you are doing well",
        "Hi there",
        "Good day",
        "Hope everything goes smoothly on your side",
        "Hello, hope your business is thriving",
        "Hi, hope you have a nice day",
        "Greetings",
        "Hope you’re having a good week"
    ],
    request: [
        "For smoother future cooperation, could you share an alternative way for us to get in touch when needed?",
        "To facilitate our future communication, would you mind sharing another contact method for urgent matters?",
        "If we have urgent updates later, can we reach you via another contact channel?",
        "For quicker communication in the future, could we have another contact of yours?",
        "We want to keep in touch conveniently, is there another way we can contact you when necessary?",
        "To avoid missing important messages, could you offer an alternative contact for us?",
        "For future convenient communication, would it be possible to get another contact method?",
        "If the message channel has delays sometimes, may I get another contact way from you?"
    ],
    extra: [
        "It will help us respond faster for any urgent updates.",
        "This helps us avoid missing key information.",
        "We can send you updates promptly once we have news.",
        "It’s just for backup communication only.",
        "This backup contact will only be used for our business discussion."
    ],
    ending: [
        "Looking forward to your reply!",
        "Waiting for your kind feedback.",
        "Awaiting your response.",
        "Thanks & best regards.",
        "Appreciate your support.",
        "Hope to hear from you soon.",
        "Best wishes."
    ]
};
const lineModes = ["multi", "compact"];
// 工具函数
function randomPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randomBool() { return Math.random() > 0.5; }

// 黑名单本地存储
let blackList = JSON.parse(localStorage.getItem('tmReplyBlackList') || '[]');
function saveBlackList() {
    localStorage.setItem('tmReplyBlackList', JSON.stringify(blackList));
    document.getElementById('blackCount').innerText = blackList.length;
}
saveBlackList();

let historyList = [];
let currentText = "";
const textDom = document.getElementById('textArea');
const genBtn = document.getElementById('genBtn');
const copyBtn = document.getElementById('copyBtn');
const clearBlackBtn = document.getElementById('clearBlackBtn');
const clearHistoryBtn = document.getElementById('clearHistoryBtn');
const historyBox = document.getElementById('historyBox');
const copyTip = document.getElementById('copyTip');

// 登录元素
const loginWrap = document.getElementById('loginWrap');
const emailInput = document.getElementById('emailInput');
const loginBtn = document.getElementById('loginBtn');
const loginErr = document.getElementById('loginErr');
const loadingText = document.getElementById('loadingText');

// 获取今日日期字符串（YYYY‑MM‑DD）
function getTodayKey(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
}
const todayKey = getTodayKey();
const localAuth = localStorage.getItem('tmToolAuth');

// 定时校验授权，60秒一次
async function startAuthCheck(){
    checkTimer = setInterval(async ()=>{
        try {
            const res = await fetch(`${AUTH_JSON_URL}?t=${Date.now()}`, { cache:"no-store" });
            const data = await res.json();
            const list = (data.emails||[]).map(e=>e.toLowerCase());
            if(!list.includes(currentLoginEmail)){
                alert("当前授权已失效，请重新登录");
                clearInterval(checkTimer);
                localStorage.removeItem("tmToolAuth");
                location.reload();
            }
        }catch(e){
            console.log("授权校验异常",e);
        }
    },60000);
}
window.addEventListener("beforeunload",()=>{
    if(checkTimer) clearInterval(checkTimer);
});

// 授权逻辑
if(localAuth && localAuth === todayKey){
    loginWrap.classList.add('hidden');
}else{
    fetch(`${AUTH_JSON_URL}?t=${Date.now()}`, { cache:"no-store" })
    .then(res=>res.json())
    .then(data=>{
        validEmailList = (data.emails || []).map(e=>e.toLowerCase());
        loadingText.textContent = "";
        emailInput.disabled = false;
        loginBtn.disabled = false;
    })
    .catch(err=>{
        loadingText.textContent = "网络错误，无法获取授权列表，请检查网络";
    })
}
loginBtn.onclick = ()=>{
    const inputVal = emailInput.value.trim().toLowerCase();
    if(validEmailList.includes(inputVal)){
        loginWrap.classList.add('hidden');
        loginErr.textContent = "";
        currentLoginEmail = inputVal;
        localStorage.setItem('tmToolAuth', todayKey);
        startAuthCheck();
    }else{
        loginErr.textContent = "邮箱不在今日授权列表，请核对";
    }
}
emailInput.onkeydown = e=>{
    if(e.key === "Enter") loginBtn.click();
}

// 生成话术逻辑
genBtn.onclick = () => {
    let finalText;
    let retry = 0;
    const maxRetry = 300;
    do {
        const greet = randomPick(lib.greet);
        const req = randomPick(lib.request);
        const extraNote = randomPick(lib.extra);
        const ending = randomPick(lib.ending);
        const lineMode = randomPick(lineModes);
        // 随机调换顺序
        const swap = randomBool();
        let partA, partB;
        if(swap){
            partA = extraNote;
            partB = req;
        }else{
            partA = req;
            partB = extraNote;
        }
        if(lineMode === "multi"){
            finalText = `${greet}.
${partA}
${partB}
${ending}`;
        }else{
            finalText = `${greet}. ${partA} ${partB} ${ending}`;
        }
        retry++;
    } while(blackList.includes(finalText) && retry < maxRetry);

    currentText = finalText;
    textDom.value = currentText;
    historyList.push(currentText);
    if(historyList.length > 10) historyList.shift();
    historyBox.innerText = "最近生成：\n" + historyList.map((t,i)=>`${i+1}. ${t.slice(0,70)}...`).join("\n");
    copyTip.textContent = "";
};

// 复制逻辑
copyBtn.onclick = async ()=>{
    let useText = currentText || textDom.value.trim();
    if(!useText) {
        copyTip.textContent = "⚠️请先生成话术！";
        setTimeout(()=>copyTip.textContent="",2500);
        return;
    }
    if(!blackList.includes(useText)){
        blackList.push(useText);
        saveBlackList();
    }
    try{
        await navigator.clipboard.writeText(useText);
        copyTip.textContent = "✅复制成功，已加入黑名单";
    }catch(e){
        copyTip.textContent = "⚠️浏览器复制失败，请手动Ctrl+C复制，本条已加入黑名单";
    }
    setTimeout(()=>copyTip.textContent="",2500);
}

// 清空黑名单
clearBlackBtn.onclick = ()=>{
    if(confirm("确认清空黑名单？清空后旧话术会重新参与生成")){
        blackList = [];
        saveBlackList();
        copyTip.textContent = "黑名单已清空";
        setTimeout(()=>copyTip.textContent="",2000);
    }
}
// 清空临时历史
clearHistoryBtn.onclick = ()=>{
    historyList = [];
    historyBox.innerText = "最近生成记录：";
    textDom.value = "";
    currentText = "";
    copyTip.textContent = "";
}
</script>
</body>
</html>
