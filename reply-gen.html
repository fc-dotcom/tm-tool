<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>跟进索要联系方式话术</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif;margin:0;padding:0}
body{background:#f4f7fa;padding:30px;max-width:1000px;margin:0 auto}
h1{font-size:22px;margin-bottom:8px;color:#222}
.desc{color:#666;margin-bottom:20px;font-size:14px}
.box{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 10px #00000010}
#textArea{width:100%;min-height:240px;border:1px solid #ddd;padding:16px;font-size:15px;white-space:pre-line;border-radius:8px;resize:vertical}
.btns{margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
button{padding:10px 18px;border:none;border-radius:8px;cursor:pointer;font-size:15px;color:#fff}
#genBtn{background:#1677ff;}
#copyBtn{background:#36cba7;}
#clearBlackBtn{background:#e74c3c;}
#clearHistoryBtn{background:#9b78ff;}
button:active{opacity:0.85}
.tip{margin-top:12px;color:#666;font-size:14px;line-height:1.5}
.history{margin-top:16px;padding:12px;background:#f8f9fa;border-radius:8px;font-size:13px;color:#444;max-height:180px;overflow:auto}
.blackInfo{margin-top:10px;color:#c0392b;font-size:13px}
.copyTip{margin-top:8px;color:#27ae60;min-height:22px;font-size:14px}
/* 登录弹窗样式 */
.login-wrap{position:fixed;inset:0;background:rgba(0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:999}
.login-card{background:#fff;padding:28px;border-radius:12px;width:360px}
.login-card h2{margin:0 0 16px;font-size:20px}
.login-card input{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:16px;margin-bottom:14px}
.login-card button{width:100%;background:#1677ff;color:#fff;padding:10px;border-radius:8px;border:none;font-size:16px}
.login-err{color:red;margin-bottom:10px;font-size:14px}
.hidden{display:none !important;}
.loading-text{color:#444;margin-bottom:10px}
</style>
</head>
<body>
<!-- 邮箱登录弹窗 -->
<div class="login-wrap" id="loginWrap">
    <div class="login-card">
        <h2>每日授权验证</h2>
        <div class="loading-text" id="loadingText">正在加载授权列表...</div>
        <div class="login-err" id="loginErr"></div>
        <input type="text" id="emailInput" placeholder="请输入今日授权邮箱" disabled>
        <button id="loginBtn" disabled>进入工具</button>
    </div>
</div>
<div class="box" id="toolBox">
<h1>跟进索要联系方式话术</h1>
<div class="desc">商家回复后使用｜模块化随机拼接委婉请求备用沟通途径｜复制自动加入黑名单避免重复</div>
<textarea id="textArea" readonly>点击【生成话术】获取跟进话术</textarea>
<div class="btns">
<button id="genBtn">生成话术</button>
<button id="copyBtn">复制到剪贴板</button>
<button id="clearBlackBtn">清空黑名单</button>
<button id="clearHistoryBtn">清空临时历史</button>
</div>
<div class="copyTip" id="copyTip"></div>
<div class="blackInfo">黑名单数量：<span id="blackCount">0</span>（关闭页面数据不会丢失）</div>
<div class="tip">
⚠️使用提示：仅在商家已经回复消息之后发送；禁止初次询盘直接发送；
<br>若对方没有接住暗示，请转回产品、数量、交期业务话题，不要重复发送同类问句。
</div>
<div class="history" id="historyBox">
最近生成记录：
</div>
</div>
<script>
const AUTH_JSON_URL = "https://fc-dotcom.github.io/tm-tool/auth.json";
let validEmailList = [];
let currentLoginEmail = "";
let checkTimer = null;

// 拆解自原有30条长句词库，分为【问候、请求主体、目的补充、结尾】
const lib = {
    greet: [
        "To lay a solid foundation for our potential business partnership",
        "With our prospective commercial cooperation in mind",
        "In pursuit of more efficient joint‑business work ahead",
        "To help our intended collaboration run without unnecessary hiccups",
        "For the sake of reliable communication throughout our future partnership",
        "Aiming for more responsive interaction for our upcoming commercial ties",
        "To facilitate timely coordination within our projected business partnership",
        "Considering the long‑term outlook for our possible collaboration",
        "In order that our planned commercial cooperation may move forward without delay",
        "To support fast‑paced coordination for our hopeful business partnership",
        "With streamlined joint‑work as our goal for future commerce",
        "For the benefit of responsive exchanges across our prospective commercial alliance",
        "To prevent communication gaps within our intended upcoming partnership",
        "In furtherance of our likely commercial collaboration",
        "Looking ahead to coordinated progress for our projected business ties",
        "To enable faster handling for matters concerning our future joint‑business work",
        "Bearing our hopeful long‑term commercial partnership in view",
        "In the interests of dependable interaction for our planned collaboration",
        "To make certain key business matters flow smoothly for our prospective alliance",
        "With effective business alignment as our target for coming cooperation",
        "To minimize information delays for our anticipated partnership",
        "For more agile handling of business events in our projected cooperation",
        "In expectation of stable long‑term commercial links",
        "To ensure important business notifications get through for our intended partnership",
        "With better business synchronisation in view for our upcoming collaboration",
        "To avoid hold‑ups during key phases of our potential cooperation",
        "For smoother alignment on business details within our prospective partnership",
        "In support of quick resolution for pressing matters in our planned collaboration",
        "Looking toward steady commercial progress between us",
        "To build more reliable interaction channels for our hoped‑for future cooperation"
    ],
    request: [
        "could you provide an alternate means to reach you should business needs arise?",
        "could you offer an independent route to reach you whenever circumstances demand?",
        "could you share another viable option to reach you at critical moments?",
        "could you supply a secondary means to reach you as‑and‑when required?",
        "could you furnish an extra practical route to reach you on an as‑needed basis?",
        "could you provide another workable option to reach you anytime?",
        "could you offer an alternative practical route to reach you when urgency arises?",
        "could you share a separate workable means to reach you amid pressing business scenarios?",
        "could you present another feasible option to reach you whenever the occasion arises?",
        "could you deliver an alternate viable route to reach you for urgent‑related affairs?",
        "could you provide a secondary practical means to reach you whenever business conditions call for it?",
        "could you offer another independent option to reach you on demand?",
        "could you share an extra feasible route to reach you should important matters surface?",
        "could you supply an alternate workable means to reach you during time‑sensitive business situations?",
        "could you furnish another practical option to reach you whenever real‑time support is needed?",
        "could you offer a separate viable means to reach you as necessity dictates?",
        "could you provide an additional workable route to reach you for unexpected business developments?",
        "could you share another alternate option to reach you whenever prompt communication is required?",
        "could you supply a secondary viable route to reach you amid unforeseen business events?",
        "could you furnish an independent practical means to reach you on occasions of high priority?",
        "could you offer another feasible means to reach you when urgent business topics occur?",
        "could you provide a separate workable route to reach you as business urgency dictates?",
        "could you share an alternate practical option to reach you should time‑pressing issues appear?",
        "could you supply an extra viable means to reach you whenever critical situations emerge?",
        "could you furnish another independent option to reach you for time‑critical discussions?",
        "could you offer a secondary practical route to reach you on an as‑needed basis?",
        "could you provide another workable means to reach you amid sudden business updates?",
        "could you share an alternate feasible route to reach you whenever business emergencies pop up?",
        "could you supply a separate viable option to reach you for high‑priority business conversations?",
        "could you furnish another practical means to reach you when business‑critical moments come?"
    ],
    extra: [
        "Your insight would be highly valued.",
        "Thank you for giving this your thought.",
        "We are looking forward to your perspective.",
        "Many thanks for your consideration.",
        "We welcome your comments.",
        "Your input means a great deal.",
        "Grateful for your reply.",
        "Please feel free to advise us.",
        "We appreciate your time.",
        "We await your viewpoint.",
        "Thank you for your feedback.",
        "Kindly share your thoughts with us.",
        "Much thanks for your guidance.",
        "We hold your reply in high regard.",
        "We would be glad to hear from you.",
        "Your advice is sincerely appreciated.",
        "Please let us know your stance.",
        "Many thanks for your attention.",
        "We would value your opinion.",
        "Kindly offer your perspective.",
        "Thank you for your kind input.",
        "We are pleased to receive your view.",
        "Your comments will be well‑received.",
        "We appreciate your guidance.",
        "Many thanks for your insights.",
        "Please kindly advise your side.",
        "We look forward to hearing your thoughts.",
        "Grateful for your kind feedback.",
        "Your standpoint is greatly appreciated.",
        "We welcome your kind response."
    ],
    ending: [
        "Thank you.",
        "Best regards.",
        "Looking forward to your reply."
    ]
};
const lineModes = ["multi", "compact"];

//工具函数
function randomPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randomBool() { return Math.random() > 0.5; }

//黑名单独立存储
let blackList = JSON.parse(localStorage.getItem('tmReplyBlackList') || '[]');
function saveBlackList() {
    localStorage.setItem('tmReplyBlackList', JSON.stringify(blackList));
    document.getElementById('blackCount').innerText = blackList.length;
}
saveBlackList();

let historyList = [];
let currentText = "";

//dom
const textDom = document.getElementById('textArea');
const genBtn = document.getElementById('genBtn');
const copyBtn = document.getElementById('copyBtn');
const clearBlackBtn = document.getElementById('clearBlackBtn');
const clearHistoryBtn = document.getElementById('clearHistoryBtn');
const historyBox = document.getElementById('historyBox');
const copyTip = document.getElementById('copyTip');
const loginWrap = document.getElementById('loginWrap');
const emailInput = document.getElementById('emailInput');
const loginBtn = document.getElementById('loginBtn');
const loginErr = document.getElementById('loginErr');
const loadingText = document.getElementById('loadingText');

//日期key，和index统一
function getTodayKey(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
}
const todayKey = getTodayKey();
const localAuth = localStorage.getItem('tmToolAuth');

//定时校验授权 60秒
async function startAuthCheck(){
    checkTimer = setInterval(async ()=>{
        try {
            const res = await fetch(`${AUTH_JSON_URL}?t=${Date.now()}`, { cache:"no-store" });
            const data = await res.json();
            const list = (data.emails||[]).map(e=>e.toLowerCase());
            if(!list.includes(currentLoginEmail)){
                alert("当前授权已失效，请重新登录");
                clearInterval(checkTimer);
                localStorage.removeItem("tmToolAuth");
                location.reload();
            }
        }catch(e){
            console.log("授权校验异常",e);
        }
    },60000);
}
window.addEventListener("beforeunload",()=>{
    if(checkTimer) clearInterval(checkTimer);
});

//登录初始化
if(localAuth && localAuth === todayKey){
    loginWrap.classList.add('hidden');
}else{
    fetch(`${AUTH_JSON_URL}?t=${Date.now()}`, { cache:"no-store" })
    .then(res=>res.json())
    .then(data=>{
        validEmailList = (data.emails || []).map(e=>e.toLowerCase());
        loadingText.textContent = "";
        emailInput.disabled = false;
        loginBtn.disabled = false;
    })
    .catch(err=>{
        loadingText.textContent = "网络错误，无法获取授权列表，请检查网络";
    })
}

loginBtn.onclick = ()=>{
    const inputVal = emailInput.value.trim().toLowerCase();
    if(validEmailList.includes(inputVal)){
        loginWrap.classList.add('hidden');
        loginErr.textContent = "";
        currentLoginEmail = inputVal;
        localStorage.setItem('tmToolAuth', todayKey);
        startAuthCheck();
    }else{
        loginErr.textContent = "邮箱不在今日授权列表，请核对";
    }
}
emailInput.onkeydown = e=>{
    if(e.key === "Enter") loginBtn.click();
}

//生成话术：随机拼接 + 随机调换顺序，对标index逻辑
genBtn.onclick = () => {
    let finalText;
    let retry = 0;
    const maxRetry = 300;
    do {
        const partGreet = randomPick(lib.greet);
        const partReq = randomPick(lib.request);
        const partExtra = randomPick(lib.extra);
        const partEnd = randomPick(lib.ending);
        const lineMode = randomPick(lineModes);
        //随机调换请求与补充说明顺序
        const swapOrder = randomBool();
        const s1 = swapOrder ? partExtra : `${partGreet}, ${partReq}`;
        const s2 = swapOrder ? `${partGreet}, ${partReq}` : partExtra;

        if(lineMode === "multi"){
            finalText = `${s1}
${s2}
${partEnd}`;
        }else{
            finalText = `${s1} ${s2} ${partEnd}`;
        }
        retry++;
    } while(blackList.includes(finalText) && retry < maxRetry);

    currentText = finalText;
    textDom.value = currentText;
    historyList.push(currentText);
    if(historyList.length > 10) historyList.shift();
    historyBox.innerText = "最近生成：\n" + historyList.map((t,i)=>`${i+1}. ${t.slice(0,70)}...`).join("\n");
    copyTip.textContent = "";
};

//复制逻辑
copyBtn.onclick = async ()=>{
    let useText = currentText || textDom.value.trim();
    if(!useText) {
        copyTip.textContent = "⚠️请先生成话术！";
        setTimeout(()=>copyTip.textContent="",2500);
        return;
    }
    if(!blackList.includes(useText)){
        blackList.push(useText);
        saveBlackList();
    }
    try{
        await navigator.clipboard.writeText(useText);
        copyTip.textContent = "✅复制成功，已加入黑名单";
    }catch(e){
        copyTip.textContent = "⚠️浏览器复制失败，请手动Ctrl+C复制，本条已加入黑名单";
        console.log("复制异常：", e);
    }
    setTimeout(()=>copyTip.textContent="",2500);
}

//清空黑名单
clearBlackBtn.onclick = ()=>{
    if(confirm("确认清空黑名单？清空后旧话术会重新参与生成")){
        blackList = [];
        saveBlackList();
        copyTip.textContent = "黑名单已清空";
        setTimeout(()=>copyTip.textContent="",2000);
    }
}
//清空临时历史
clearHistoryBtn.onclick = ()=>{
    historyList = [];
    historyBox.innerText = "最近生成记录：";
    textDom.value = "";
    currentText = "";
    copyTip.textContent = "";
}
</script>
</body>
</html>
