<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>国际站TM话术</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif;margin:0;padding:0}
body{background:#f4f7fa;padding:30px;max-width:1000px;margin:0 auto}
h1{font-size:22px;margin-bottom:8px;color:#222}
.desc{color:#666;margin-bottom:20px;font-size:14px}
.box{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 10px #00000010}
#textArea{width:100%;min-height:240px;border:1px solid #ddd;padding:16px;font-size:15px;white-space:pre-line;border-radius:8px;resize:vertical}
.btns{margin-top:16px;display:flex;gap:12px;flex-wrap:wrap}
button{padding:10px 18px;border:none;border-radius:8px;cursor:pointer;font-size:15px}
#genBtn{background:#1677ff;color:#fff}
#copyBtn{background:#36cba7;color:#fff}
#clearBlackBtn{background:#e74c3c;color:#fff}
#clearHistoryBtn{background:#9b78ff;color:#fff}
button:active{opacity:0.85}
.tip{margin-top:12px;color:#666;font-size:14px;line-height:1.5}
.history{margin-top:16px;padding:12px;background:#f8f9fa;border-radius:8px;font-size:13px;color:#444;max-height:180px;overflow:auto}
.blackInfo{margin-top:10px;color:#c0392b;font-size:13px}
.copyTip{margin-top:8px;color:#27ae60;min-height:22px;font-size:14px}
/* 登录弹窗样式 */
.login-wrap{position:fixed;inset:0;background:rgba(0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:999}
.login-card{background:#fff;padding:28px;border-radius:12px;width:360px}
.login-card h2{margin:0 0 16px;font-size:20px}
.login-card input{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:16px;margin-bottom:14px}
.login-card button{width:100%;background:#1677ff;color:#fff;padding:10px;border-radius:8px;border:none;font-size:16px}
.login-err{color:red;margin-bottom:10px;font-size:14px}
.hidden{display:none !important;}
.loading-text{color:#444;margin-bottom:10px}
.quantity-info{background:#e8f4ff;padding:10px;border-radius:8px;margin-bottom:14px;font-size:14px;color:#1677ff;}
</style>
</head>
<body>
<!-- 邮箱登录弹窗 -->
<div class="login-wrap" id="loginWrap">
    <div class="login-card">
        <h2>每日授权验证</h2>
        <div class="loading-text" id="loadingText">正在加载授权列表...</div>
        <div class="login-err" id="loginErr"></div>
        <input type="text" id="emailInput" placeholder="请输入今日授权邮箱" disabled>
        <button id="loginBtn" disabled>进入工具</button>
    </div>
</div>
<div class="box" id="toolBox">
<h1>TM拓客话术</h1>
<div class="desc">模块化随机拼接 + 语序随机调换 + 复制自动加入黑名单</div>
<div class="quantity-info">
已发送计数：<span id="sendCountText">0</span>｜当前数量区间：<span id="qtyRangeText">60‑90</span>
</div>
<textarea id="textArea" readonly>点击【生成差异化话术】</textarea>
<div class="btns">
<button id="genBtn">生成差异化话术</button>
    <div style="margin:20px 0;">
  <a href="./reply-gen.html" target="_blank">
    <button style="padding:10px 20px;font-size:16px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;">
      👉 打开跟进索要联系方式话术生成器
    </button>
  </a>
</div>
<button id="copyBtn">复制到剪贴板</button>
<button id="clearBlackBtn">清空黑名单</button>
<button id="clearHistoryBtn">清空临时历史</button>
</div>
<div class="copyTip" id="copyTip"></div>
<div class="blackInfo">黑名单数量：<span id="blackCount">0</span>（关闭页面数据不会丢失）</div>
<div class="tip">
风控要点：点击复制自动加入黑名单，避免重复文本；语序随机打乱句子结构；
<br>数量规则：复制满10条，采购数量区间自动+10。
</div>
<div class="history" id="historyBox">
最近生成记录：
</div>
</div>
<script>
// ============ 在这里替换成你的auth.json远程URL ============
const AUTH_JSON_URL = "https://fc-dotcom.github.io/tm-tool/auth.json";
let validEmailList = [];
let currentLoginEmail = "";
let checkTimer = null;
// 数量配置（后续可以迁移到config.json远程）
const quantityConfig = {
    baseMin: 60,
    baseMax: 90,
    step: 10
};
// 读取本地发送计数
let sendCount = Number(localStorage.getItem("tmSendCount") || 0);
// ============ 30套数量描述短语库 ============
const quantityPhrases = [
    "estimated quantity around {min}‑{max} units",
    "target volume about {min}‑{max} pcs",
    "we plan to take roughly {min}‑{max} pieces",
    "our target quantity would be {min}‑{max} units",
    "looking at an initial volume of {min}‑{max} units",
    "we are considering roughly {min}‑{max} pcs for the first order",
    "the tentative order volume is {min}‑{max} pieces",
    "we intend to purchase around {min}‑{max} units at first",
    "our planned trial quantity is {min}‑{max} pcs",
    "we are aiming for approximately {min}‑{max} units initially",
    "proposed order size would be {min}‑{max} pieces",
    "we estimate our first purchase at {min}‑{max} pcs",
    "the projected quantity for trial is {min}‑{max} units",
    "we’re thinking of an initial run of {min}‑{max} pieces",
    "anticipated order volume is about {min}‑{max} units",
    "we may start with roughly {min}‑{max} pcs",
    "our preliminary plan is {min}‑{max} units for trial",
    "target trial quantity sits around {min}‑{max} pieces",
    "we’re looking to source about {min}‑{max} pcs at the beginning",
    "the expected volume for this trial order is {min}‑{max} units",
    "tentatively we want {min}‑{max} pieces for our first purchase",
    "we plan to start off with {min}‑{max} units",
    "approximate order quantity will be {min}‑{max} pcs",
    "our intended trial volume is roughly {min}‑{max} pieces",
    "we are exploring an initial order of {min}‑{max} units",
    "we would like to test with around {min}‑{max} pcs",
    "projected first order quantity: {min}‑{max} pieces",
    "we’re considering a starting volume of {min}‑{max} units",
    "the rough estimate for our trial purchase is {min}‑{max} pcs",
    "we plan to place an initial order of about {min}‑{max} pieces"
];
// ============ 默认词库 ============
const defaultLib = {
    greetings: [
        "Hope you’re doing well","Hi there","Good day","Hope everything goes well",
        "Hello, hope all’s fine","Hi, hope your week is going well","Greetings",
        "Hope your business is doing great","Hello there","Hi hope you’re having a good day",
        "Warm greetings","Hello, hope business is booming","Hey, hope you’re good",
        "Good morning","Good afternoon"
    ],
    purchaseIntent: [
        "we are planning to order some products","we intend to purchase your goods",
        "we’re looking to buy some of your items","our team is considering placing an order",
        "We’re interested in sourcing some of your products","We would like to source goods from your company",
        "We’re looking to make purchases from you","We have interest in purchasing your merchandise",
        "Our team wants to inquire about buying your goods","We’re looking into purchasing your product range",
        "We intend to source merchandise from your factory","We’re considering a trial purchase of your products",
        "We would like to start with small purchases first","Our company plans to test your items via small orders",
        "We want to make a trial order of your products","We’re planning to place an order, probably starting small",
        "We want to test your products in our market first"
    ],
    smallBatchQ: [
        "May we place orders with smaller quantities?","Is it possible to order in smaller batches?",
        "Do you accept small quantity orders?","May we place small quantity orders?",
        "wonder if small‑batch orders are acceptable","Do you accept low minimum orders?",
        "Can we place orders with smaller order volumes?","Are small‑sized orders available?",
        "May we proceed with low‑volume orders?","Do you accept small trial orders?",
        "Can we place low‑volume trial purchases?","Are smaller trial quantities allowed?",
        "May we place minimal order runs?","Are small trial quantities supported?",
        "Is it okay to place orders with low volumes?","Do you allow small volume trial orders?",
        "Are you able to accept smaller order sizes?","Can we do small orders first?",
        "Small batches okay?","Want to order small qty. Possible?"
    ],
    leadTimeQ: [
        "What is the lead time?","Could you advise your production lead time?",
        "What’s your production lead time?","Could you share your current lead time?",
        "How long will production take?","What is your production turnaround time?",
        "How soon can you deliver the goods?","What’s your turnaround for production?",
        "How much time is needed for manufacturing?","What timeline can you offer for production?",
        "How fast can you finish manufacturing?","Could you tell me your manufacturing lead time?",
        "How long would it take to produce the goods?","Kindly advise your production schedule.",
        "What would be your estimated production time?","And how long till it’s ready?",
        "What’s the lead time roughly?","How long does production usually take?",
        "Could you let me know your typical lead time?","Lead time?"
    ],
    endings: [
        "Looking forward to your reply!","Waiting for your feedback.","Awaiting your reply.",
        "Thanks & best regards.","Appreciate your information.","Thank you for your time.",
        "Your input will be much appreciated.","Waiting eagerly for your reply.","Thanks for your assistance.",
        "Best wishes.","Many thanks.","Looking forward to hearing your thoughts.","Thanks a lot.",
        "Awaiting your kind response.","Cheers.","Thanks.","Best,","Thanks in advance.","Thank you.","Regards."
    ]
};
const adverbs = ["currently", "roughly", "initially"];
const lineModes = ["multi", "compact"];
// 工具函数
function randomPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randomBool() { return Math.random() > 0.5; }
// 获取当前数量区间
function getCurrentQtyRange(){
    const offset = Math.floor(sendCount / 10) * quantityConfig.step;
    const min = quantityConfig.baseMin + offset;
    const max = quantityConfig.baseMax + offset;
    return {min, max, text:`${min}‑${max}`};
}
// 随机挑选一条数量句子，替换{min}{max}占位符
function getRandomQtySentence(min,max){
    const template = randomPick(quantityPhrases);
    return template.replaceAll("{min}",min).replaceAll("{max}",max);
}
// 更新页面数量信息
function renderQtyInfo(){
    document.getElementById("sendCountText").innerText = sendCount;
    const qty = getCurrentQtyRange();
    document.getElementById("qtyRangeText").innerText = qty.text;
}
// 增加发送计数（复制调用）
function incSendCount(){
    sendCount +=1;
    localStorage.setItem("tmSendCount", sendCount);
    renderQtyInfo();
}
// 词库固定使用默认词库
let lib = JSON.parse(JSON.stringify(defaultLib));
// 黑名单
let blackList = JSON.parse(localStorage.getItem('tmBlackList') || '[]');
function saveBlackList() {
    localStorage.setItem('tmBlackList', JSON.stringify(blackList));
    document.getElementById('blackCount').innerText = blackList.length;
}
saveBlackList();
renderQtyInfo();
let historyList = [];
let currentText = "";
const textDom = document.getElementById('textArea');
const genBtn = document.getElementById('genBtn');
const copyBtn = document.getElementById('copyBtn');
const clearBlackBtn = document.getElementById('clearBlackBtn');
const clearHistoryBtn = document.getElementById('clearHistoryBtn');
const historyBox = document.getElementById('historyBox');
const copyTip = document.getElementById('copyTip');
// 登录元素
const loginWrap = document.getElementById('loginWrap');
const emailInput = document.getElementById('emailInput');
const loginBtn = document.getElementById('loginBtn');
const loginErr = document.getElementById('loginErr');
const loadingText = document.getElementById('loadingText');
const toolBox = document.getElementById('toolBox');
// 获取今日日期字符串（YYYY‑MM‑DD）
function getTodayKey(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
}
const todayKey = getTodayKey();
const localAuth = localStorage.getItem('tmToolAuth');
// 定时校验授权，60秒一次
async function startAuthCheck(){
    checkTimer = setInterval(async ()=>{
        try {
            const res = await fetch(`${AUTH_JSON_URL}?t=${Date.now()}`, { cache:"no-store" });
            const data = await res.json();
            const list = (data.emails||[]).map(e=>e.toLowerCase());
            if(!list.includes(currentLoginEmail)){
                alert("当前授权已失效，请重新登录");
                clearInterval(checkTimer);
                localStorage.removeItem("tmToolAuth");
                location.reload();
            }
        }catch(e){
            console.log("授权校验异常",e);
        }
    },60000);
}
window.addEventListener("beforeunload",()=>{
    if(checkTimer) clearInterval(checkTimer);
});
// 先判断本地是否已有今日授权
if(localAuth && localAuth === todayKey){
    loginWrap.classList.add('hidden');
}else{
    // 联网拉取远程授权json
    fetch(`${AUTH_JSON_URL}?t=${Date.now()}`, { cache:"no-store" })
    .then(res=>res.json())
    .then(data=>{
        validEmailList = (data.emails || []).map(e=>e.toLowerCase());
        loadingText.textContent = "";
        emailInput.disabled = false;
        loginBtn.disabled = false;
    })
    .catch(err=>{
        loadingText.textContent = "网络错误，无法获取授权列表，请检查网络";
    })
}
// 邮箱登录校验
loginBtn.onclick = ()=>{
    const inputVal = emailInput.value.trim().toLowerCase();
    if(validEmailList.includes(inputVal)){
        loginWrap.classList.add('hidden');
        loginErr.textContent = "";
        currentLoginEmail = inputVal;
        localStorage.setItem('tmToolAuth', todayKey);
        startAuthCheck();
    }else{
        loginErr.textContent = "邮箱不在今日授权列表，请核对";
    }
}
emailInput.onkeydown = e=>{
    if(e.key === "Enter") loginBtn.click();
}
// 生成话术（语序随机 + 黑名单过滤 + 数量嵌入）
genBtn.onclick = () => {
    let finalText;
    let retry = 0;
    const maxRetry = 300;
    const qty = getCurrentQtyRange();
    const qtySentence = getRandomQtySentence(qty.min, qty.max);
    do {
        const greet = randomPick(lib.greetings);
        let purchase = randomPick(lib.purchaseIntent);
        // 100%插入随机数量短语
        purchase += `, ${qtySentence}`;
        const smallBatch = randomPick(lib.smallBatchQ);
        const leadtime = randomPick(lib.leadTimeQ);
        const ending = randomPick(lib.endings);
        const lineMode = randomPick(lineModes);
        const adverbText = randomBool() ? ` ${randomPick(adverbs)}` : "";
        // A功能：语序随机，50%概率交期在前，小批量在后
        const swapOrder = randomBool();
        const q1 = swapOrder ? leadtime : smallBatch;
        const q2 = swapOrder ? smallBatch : leadtime;
        if(lineMode === "multi"){
            finalText = `${greet}.
${purchase}${adverbText}.
${q1}
${q2}
${ending}`;
        }else{
            finalText = `${greet}. ${purchase}${adverbText}. ${q1} ${q2} ${ending}`;
        }
        retry++;
    } while(blackList.includes(finalText) && retry < maxRetry);
    currentText = finalText;
    textDom.value = currentText;
    historyList.push(currentText);
    if(historyList.length > 10) historyList.shift();
    historyBox.innerText = "最近生成：\n" + historyList.map((t,i)=>`${i+1}. ${t.slice(0,70)}...`).join("\n");
    copyTip.textContent = "";
};
// 复制按钮：点击立刻拉黑+计数，兜底取文本框内容，不依赖剪贴板成功
copyBtn.onclick = async ()=>{
    let useText = currentText || textDom.value.trim();
    if(!useText) {
        copyTip.textContent = "⚠️请先生成话术！";
        setTimeout(()=>copyTip.textContent="",2500);
        return;
    }
    // 点击就拉黑计数
    if(!blackList.includes(useText)){
        blackList.push(useText);
        saveBlackList();
    }
    incSendCount();
    try{
        await navigator.clipboard.writeText(useText);
        copyTip.textContent = "✅复制成功，已加入黑名单，计数+1";
    }catch(e){
        copyTip.textContent = "⚠️浏览器复制失败，请手动Ctrl+C复制，本条已加入黑名单";
        console.log("复制异常：", e);
    }
    setTimeout(()=>copyTip.textContent="",2500);
}
// 清空黑名单
clearBlackBtn.onclick = ()=>{
    if(confirm("确认清空黑名单？清空后旧话术会重新参与生成")){
        blackList = [];
        saveBlackList();
        copyTip.textContent = "黑名单已清空";
        setTimeout(()=>copyTip.textContent="",2000);
    }
}
// 清空临时历史
clearHistoryBtn.onclick = ()=>{
    historyList = [];
    historyBox.innerText = "最近生成记录：";
    textDom.value = "";
    currentText = "";
    copyTip.textContent = "";
}
</script>
</body>
</html>
